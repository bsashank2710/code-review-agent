[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-agent"
version = "1.0.0"
description = "Static review comments with a tool loop that cannot invent findings"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Sashank Badri Narayan"}]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
codereview = "codereview.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
